<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440" role="img" aria-labelledby="title desc"><title id="title">仰卧反向卷腹 · 起止姿势 · 辅助示意</title><desc id="desc">仰卧、屈膝的骨盆反向卷起。左为起点：屈膝、骨盆贴垫；右为终点：骨盆卷起离垫。金色标记表示动作方向或骨盆位置。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b67525"/></marker></defs><rect width="640" height="440" rx="24" fill="#edf4f5"/><text x="26" y="39" fill="#243c4a" font-size="26" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">仰卧反向卷腹 · 起止姿势</text><text x="614" y="38" fill="#617681" font-size="17" text-anchor="end" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">辅助示意</text><rect x="15" y="60" width="300" height="334" rx="16" fill="#fff"/><rect x="325" y="60" width="300" height="334" rx="16" fill="#fff"/><g transform="translate(10,70) scale(.94)"><line x1="20" y1="303" x2="295" y2="303" stroke="#cbd4d9" stroke-width="2" stroke-linecap="round"/><rect x="32" y="289" width="250" height="15" rx="6" fill="#9fc6d0"/><circle cx="49" cy="279" r="17" fill="#efbba0"/><polyline points="75,280 114,280" fill="none" stroke="#1c7992" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><polyline points="114,280 172,280 194,203 264,203" fill="none" stroke="#1c7992" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><circle cx="172" cy="280" r="9" fill="#b67525"/><polyline points="82,285 137,289" fill="none" stroke="#1c7992" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/></g><g transform="translate(320,70) scale(.94)"><line x1="20" y1="303" x2="295" y2="303" stroke="#cbd4d9" stroke-width="2" stroke-linecap="round"/><rect x="32" y="289" width="250" height="15" rx="6" fill="#9fc6d0"/><circle cx="49" cy="279" r="17" fill="#efbba0"/><polyline points="75,280 114,280" fill="none" stroke="#1c7992" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><path d="M 114 280 Q 143 274 155 243" fill="none" stroke="#1c7992" stroke-width="12" stroke-linecap="round"/><polyline points="155,243 151,176 219,185" fill="none" stroke="#1c7992" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/><circle cx="155" cy="243" r="9" fill="#b67525"/><path d="M 196 272 Q 195 245 178 232" fill="none" stroke="#b67525" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><polyline points="82,285 137,289" fill="none" stroke="#1c7992" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/></g><text x="165" y="378" fill="#243c4a" font-size="19" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">起点：屈膝、骨盆贴垫</text><text x="475" y="378" fill="#243c4a" font-size="19" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">终点：骨盆卷起离垫</text><text x="26" y="420" fill="#617681" font-size="16" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">原创简化图 · 动作范围与器械设置以现场指导为准</text></svg>