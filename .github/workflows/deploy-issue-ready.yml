name: Deploy IssueReady to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "projects/issue-ready/**"
      - ".github/workflows/deploy-issue-ready.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run tests
        run: npm test --prefix projects/issue-ready
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload IssueReady site
        uses: actions/upload-pages-artifact@v4
        with:
          path: projects/issue-ready/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
