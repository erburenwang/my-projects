name: File Ledger tests

on:
  push:
    paths:
      - 'projects/file-ledger/**'
      - '.github/workflows/file-ledger.yml'
  pull_request:
    paths:
      - 'projects/file-ledger/**'
      - '.github/workflows/file-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: projects/file-ledger
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install package and Markdown test renderer
        run: python -m pip install '.[test]'
      - name: Run behavior and package tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone zipapp
        run: python tools/build_zipapp.py
      - name: Run standalone zipapp
        run: python file-ledger.pyz --version
